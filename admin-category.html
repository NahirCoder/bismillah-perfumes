<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Categories | Bismillah Perfumes Admin</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>

<body>

<header class="admin-header">
  <div class="admin-header-container">

    <a href="admin.html" class="logo">
      Bismillah Perfumes <span class="admin-tag">Admin</span>
    </a>

    <nav class="admin-nav">
      <a href="admin.html">Dashboard</a>
      <a href="admin-products.html">Products</a>
      <a href="admin-categories.html">Categories</a>
      <a href="admin-settings.html">Settings</a>

      <a href="index.html" class="back-to-site">
        ← Back to Site
      </a>

      <button id="logout-btn" type="button">
        Log Out
      </button>
    </nav>

  </div>
</header>

<main class="admin-main">

  <section class="admin-page-header">
    <h1>Categories</h1>

    <button
      id="add-category-btn"
      class="btn btn-primary"
      type="button"
    >
      + Add New Category
    </button>
  </section>

  <section class="admin-table-section">

    <table class="admin-table">

      <thead>
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Description</th>
          <th>Sort Order</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="admin-categories-tbody">
        <!-- Category rows loaded dynamically by js/admin.js -->
      </tbody>

    </table>

    <p
      id="no-categories-message"
      class="no-products-message"
      style="display:none;"
    >
      No categories found.
    </p>

  </section>

  <div
    id="category-modal"
    class="admin-modal"
    style="display:none;"
  >

    <div class="admin-modal-content">

      <h2 id="category-modal-title">
        Add Category
      </h2>

      <form id="category-form">

        <input
          type="hidden"
          id="category-id"
          value=""
        >

        <label for="category-name">
          Category Name
        </label>

        <input
          type="text"
          id="category-name"
          required
        >

        <label for="category-description">
          Description
        </label>

        <textarea
          id="category-description"
          rows="3"
        ></textarea>

        <label for="category-sort-order">
          Sort Order
        </label>

        <input
          type="number"
          id="category-sort-order"
          value="0"
        >

        <label for="category-image">
          Category Image
        </label>

        <input
          type="file"
          id="category-image"
          accept="image/*"
        >

        <img
          id="category-image-preview"
          class="image-preview"
          src=""
          alt=""
          style="display:none;"
        >

        <label class="checkbox-label">

          <input
            type="checkbox"
            id="category-active"
            checked
          >

          Active (visible to customers)

        </label>

        <p
          id="category-form-error"
          class="login-error"
          style="display:none;"
        ></p>

        <div class="admin-modal-actions">

          <button
            type="button"
            id="category-cancel-btn"
            class="btn btn-secondary"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="btn btn-primary"
          >
            Save Category
          </button>

        </div>

      </form>

    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/supabase.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/admin.js" defer></script>

</body>
</html>
