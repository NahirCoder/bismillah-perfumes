<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Browse the Bismillah Perfumes collection."
    >

    <title>Perfumes | Bismillah Perfumes</title>

    <link rel="icon" href="assets/faicon.png">

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/products.css">
    <link rel="stylesheet" href="css/forms.css">

</head>

<body>

    <header class="site-header">

        <div class="container header-inner">

            <a href="index.html" class="site-logo">

                <div class="site-logo-icon">
                    🧴
                </div>

                <div>
                    <strong>Bismillah Perfumes</strong>
                    <span>Fragrance for every occasion</span>
                </div>

            </a>


            <nav class="site-nav">

                <a href="index.html">
                    Home
                </a>

                <a
                    href="products.html"
                    class="active"
                >
                    Perfumes
                </a>

                <a href="categories.html">
                    Categories
                </a>

                <a href="contact.html">
                    Contact
                </a>

            </nav>


            <button
                type="button"
                class="mobile-menu-button"
                id="mobileMenuButton"
            >
                ☰
            </button>

        </div>

    </header>


    <main>

        <section class="page-header">

            <div class="container">

                <p class="dashboard-eyebrow">
                    COLLECTION
                </p>

                <h1>
                    Our Perfumes
                </h1>

                <p>
                    Discover fragrances selected for every style,
                    personality and occasion.
                </p>

            </div>

        </section>


        <section class="products-section">

            <div class="container">

                <div class="products-toolbar">

                    <div class="search-box">

                        <span>
                            🔍
                        </span>

                        <input
                            type="search"
                            id="productSearch"
                            placeholder="Search perfumes..."
                        >

                    </div>


                    <select
                        id="productCategory"
                        class="form-control"
                    >

                        <option value="all">
                            All categories
                        </option>

                    </select>


                    <select
                        id="productGender"
                        class="form-control"
                    >

                        <option value="all">
                            All genders
                        </option>

                        <option value="men">
                            Men
                        </option>

                        <option value="women">
                            Women
                        </option>

                        <option value="unisex">
                            Unisex
                        </option>

                    </select>

                </div>


                <div
                    id="productsGrid"
                    class="product-grid"
                >

                    <div class="dashboard-loading">
                        Loading perfumes...
                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div class="container footer-inner">

            <div>

                <strong>
                    Bismillah Perfumes
                </strong>

                <p>
                    Quality fragrances for every occasion.
                </p>

            </div>

        </div>

    </footer>


    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/products.js"></script>
    <script type="module" src="js/categories.js"></script>

</body>

</html>
