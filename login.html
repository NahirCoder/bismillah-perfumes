<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Bismillah Perfumes</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<main class="login-page">
  <div class="login-box">
    <h1 class="logo">Bismillah Perfumes</h1>
    <p class="login-subtitle">Admin Login</p>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">

      <p id="login-error" class="login-error" style="display:none;"></p>

      <button type="submit" class="btn btn-primary">Log In</button>
    </form>

    <a href="index.html" class="back-link">&larr; Back to site</a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/supabase.js" defer></script>
<script src="js/auth.js" defer></script>
</body>
</html>
